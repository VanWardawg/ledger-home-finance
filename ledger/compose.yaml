# Runs Ledger with Docker. From the folder this file is in:
#   docker compose up -d
services:
  ledger:
    image: ghcr.io/moeckjeremy/ledger-home-finance:latest
    container_name: ledger
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "4317:4317"
    environment:
      # Your time zone, so "today", paydays and the email's hour are right. The default here is US Central;
      # set TZ in a .env file beside this one (for example TZ=Europe/London) to use yours.
      TZ: ${TZ:-America/Chicago}
    volumes:
      # Your finances: one SQLite database, kept in a Docker volume so it outlives updates.
      - ledger-data:/data

volumes:
  ledger-data:
